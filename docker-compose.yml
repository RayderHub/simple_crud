services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${OPENOBSERVE_USER:-admin@uteq.edu.mx}
      - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_PASSWORD:-OpenObserve123!}
      - ZO_DATA_DIR=/data
      - ZO_MEMORY_CACHE_MAX_SIZE=64
      - ZO_COMPACT_ENABLED=false
      - ZO_TELEMETRY=false
    volumes:
      - ./o2_data:/data

  app:
    build: .
    image: simple-crud:latest
    container_name: simple_crud_app
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      - openobserve
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - OPENOBSERVE_URL=http://openobserve:5080
      - OPENOBSERVE_ORG=${OPENOBSERVE_ORG:-default}
      - OPENOBSERVE_USER=${OPENOBSERVE_USER:-admin@uteq.edu.mx}
      - OPENOBSERVE_PASSWORD=${OPENOBSERVE_PASSWORD:-OpenObserve123!}
      - OTEL_SERVICE_NAME=simple-crud-flask

  infra_monitor:
    image: simple-crud:latest
    container_name: ec2_infra_monitor
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - openobserve
      - app
    pid: host
    network_mode: host
    command: ["python", "infra_monitor.py"]
    environment:
      - OPENOBSERVE_URL=http://127.0.0.1:5080
      - OPENOBSERVE_ORG=${OPENOBSERVE_ORG:-default}
      - OPENOBSERVE_USER=${OPENOBSERVE_USER:-admin@uteq.edu.mx}
      - OPENOBSERVE_PASSWORD=${OPENOBSERVE_PASSWORD:-OpenObserve123!}
      - METRICS_INTERVAL_SECONDS=10
      - EC2_INSTANCE_NAME=aws-ec2-simple-crud
